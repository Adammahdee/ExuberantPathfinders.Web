<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Graduation cap -->
  <polygon points="50,100 100,50 150,100 140,105 100,70 60,105" fill="white" opacity="0.9"/>
  
  <!-- Tassel -->
  <line x1="100" y1="70" x2="100" y2="130" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="100" cy="135" r="5" fill="white" opacity="0.8"/>
  
  <!-- Open book -->
  <g opacity="0.8">
    <path d="M 70 120 L 100 110 L 130 120" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="100" y1="110" x2="100" y2="140" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Text lines -->
  <line x1="75" y1="135" x2="95" y2="135" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="105" y1="135" x2="125" y2="135" stroke="white" stroke-width="1" opacity="0.6"/>
</svg>
