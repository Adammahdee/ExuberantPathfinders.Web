<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Three people circles -->
  <circle cx="70" cy="50" r="15" fill="white" opacity="0.9"/>
  <circle cx="100" cy="40" r="18" fill="white" opacity="0.9"/>
  <circle cx="130" cy="50" r="15" fill="white" opacity="0.9"/>
  
  <!-- Bodies -->
  <ellipse cx="70" cy="85" rx="12" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="100" cy="90" rx="14" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="130" cy="85" rx="12" ry="20" fill="white" opacity="0.8"/>
  
  <!-- Arms linked/holding hands -->
  <line x1="82" y1="75" x2="100" y2="70" stroke="white" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="118" y2="75" stroke="white" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="82" cy="75" r="4" fill="white" opacity="0.8"/>
  <circle cx="118" cy="75" r="4" fill="white" opacity="0.8"/>
  
  <!-- Legs -->
  <line x1="65" y1="105" x2="60" y2="135" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="75" y1="105" x2="80" y2="135" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="95" y1="112" x2="95" y2="145" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="105" y1="112" x2="105" y2="145" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="125" y1="105" x2="120" y2="135" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <line x1="135" y1="105" x2="140" y2="135" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Heart above -->
  <path d="M 100 15 C 95 10 85 12 85 18 C 85 22 88 25 100 33 C 112 25 115 22 115 18 C 115 12 105 10 100 15 Z" 
        fill="white" opacity="0.6"/>
</svg>
