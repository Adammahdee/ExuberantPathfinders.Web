<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="90" y="100" width="20" height="70" fill="white" opacity="0.8"/>
  
  <!-- Tree top - leaves -->
  <circle cx="75" cy="80" r="25" fill="white" opacity="0.9"/>
  <circle cx="100" cy="50" r="30" fill="white" opacity="0.9"/>
  <circle cx="125" cy="80" r="25" fill="white" opacity="0.9"/>
  
  <!-- Sun -->
  <circle cx="30" cy="40" r="15" fill="white" opacity="0.6"/>
  <line x1="30" y1="20" x2="30" y2="10" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="58" y2="40" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="45" y1="28" x2="51" y2="22" stroke="white" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Ground/grass -->
  <ellipse cx="100" cy="180" rx="60" ry="15" fill="white" opacity="0.5"/>
  
  <!-- Small flowers -->
  <circle cx="70" cy="165" r="3" fill="white" opacity="0.7"/>
  <circle cx="130" cy="170" r="3" fill="white" opacity="0.7"/>
</svg>
