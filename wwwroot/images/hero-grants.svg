<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad1)"/>
  
  <!-- Large coin/grant symbol -->
  <circle cx="200" cy="150" r="80" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="3"/>
  <text x="200" y="170" font-size="80" text-anchor="middle" fill="white" opacity="0.8">₦</text>
  
  <!-- Small floating coins -->
  <g opacity="0.6">
    <circle cx="100" cy="80" r="20" fill="white"/>
    <text x="100" y="92" font-size="24" text-anchor="middle" fill="#667eea">₦</text>
  </g>
  
  <g opacity="0.5">
    <circle cx="300" cy="120" r="25" fill="white"/>
    <text x="300" y="135" font-size="28" text-anchor="middle" fill="#764ba2">₦</text>
  </g>
  
  <g opacity="0.4">
    <circle cx="80" cy="280" r="18" fill="white"/>
    <text x="80" y="290" font-size="20" text-anchor="middle" fill="#667eea">₦</text>
  </g>
  
  <!-- Growth curve -->
  <path d="M 50,320 Q 150,200 350,100" stroke="white" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Hands supporting -->
  <g transform="translate(200, 260)">
    <path d="M -40,-20 L -30,0 L -20,-15 L -10,5 L 0,-10 L 10,8 L 20,-12 L 30,10 L 40,-8" 
          stroke="white" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>
