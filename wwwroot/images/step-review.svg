<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reviewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#reviewGrad)" opacity="0.1"/>
  
  <!-- Head/Person -->
  <circle cx="100" cy="50" r="18" fill="#3498db"/>
  
  <!-- Body -->
  <rect x="85" y="70" width="30" height="40" fill="#3498db" rx="5"/>
  
  <!-- Arms with clipboard -->
  <line x1="75" y1="80" x2="50" y2="75" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="80" x2="150" y2="75" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Clipboard -->
  <rect x="130" y="60" width="35" height="45" fill="white" stroke="#3498db" stroke-width="2" rx="3"/>
  <rect x="130" y="57" width="35" height="6" fill="#3498db"/>
  
  <!-- Checklist items on clipboard -->
  <line x1="142" y1="72" x2="160" y2="72" stroke="#3498db" stroke-width="1.5"/>
  <polyline points="138,72 141,75 144,70" fill="none" stroke="#3498db" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <line x1="142" y1="82" x2="160" y2="82" stroke="#3498db" stroke-width="1.5"/>
  <polyline points="138,82 141,85 144,80" fill="none" stroke="#3498db" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <line x1="142" y1="92" x2="160" y2="92" stroke="#3498db" stroke-width="1.5"/>
  <polyline points="138,92 141,95 144,90" fill="none" stroke="#3498db" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pen in hand -->
  <circle cx="55" cy="75" r="4" fill="#3498db"/>
  
  <!-- Legs -->
  <line x1="95" y1="110" x2="90" y2="140" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="110" x2="110" y2="140" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
</svg>
