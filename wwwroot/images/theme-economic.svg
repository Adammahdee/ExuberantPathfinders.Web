    <ellipse cx="100" cy="106" rx="8" ry="3" fill="white"/>
    <ellipse cx="100" cy="109" rx="8" ry="3" fill="white"/>
  </g>
  
  <g opacity="0.8">
    <ellipse cx="130" cy="107" rx="8" ry="3" fill="white"/>
    <ellipse cx="130" cy="110" rx="8" ry="3" fill="white"/>
